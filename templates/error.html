<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error · {{ app_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="app-body d-flex align-items-center justify-content-center min-vh-100">
  <div class="card weather-card text-center p-4" style="max-width: 420px;">
    <div class="error-emoji">{{ '😕' if code != 500 else '⚠️' }}</div>
    <h1 class="h4 mb-1">{{ code }}</h1>
    <p class="text-secondary mb-3">{{ message }}</p>
    <a href="/" class="btn btn-accent">Back to live tracker</a>
  </div>
</body>
</html>
