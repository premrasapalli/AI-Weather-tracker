[tool.ruff]
target-version = "py311"
line-length = 88
src = ["weathertracker", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "S",   # bandit (flake8-bandit)
  "C4",  # comprehensions
  "SIM", # simplify
]
ignore = [
  "S105", "S106", "S324",       # env-default secrets, tests/prefs
  "UP017",                       # timezone.utc kept for Python 3.10 support
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S110", "B023", "E501"]
"**/__init__.py" = ["I001"]
"weathertracker/**" = ["E501"]  # line length enforced by `ruff format` instead

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=weathertracker --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error"]